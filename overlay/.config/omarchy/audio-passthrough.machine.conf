# Audio passthrough headphones on the XPS (used by audio-passthrough.service).
# A part of each device name is enough; missing device = passthrough idle.
SINK="MOONDROP_Quark2|Headphone_Jack_Adapter" # MOONDROP Quark2 or Apple USB-C adapter
# The mic is always the system default input (pick it in the widget or the audio panel).
