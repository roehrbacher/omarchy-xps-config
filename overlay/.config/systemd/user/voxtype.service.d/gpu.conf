[Service]
# Vulkan build of Voxtype on the Arc B390 iGPU (Whisper large-v3-turbo q5_0).
# No -q, so each finished dictation is logged like on the PC.
ExecStart=
# Flash attention on the Arc (per machine, so it is a flag here, not in the shared config).
ExecStart=/usr/lib/voxtype/voxtype-vulkan --flash-attention daemon
