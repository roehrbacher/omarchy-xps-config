# shellcheck shell=bash
# Settings for install.sh / uninstall.sh of omarchy-xps-config.
# Install omarchy-shared-config first: this repo only adds the machine-*.lua
# files and the 50-xps.json bar fragment that the shared files load.
REPO_NAME=omarchy-xps-config

# Extra apps only this machine needs (shared list: omarchy-shared-config).
# install.sh installs only missing ones, never upgrades or removes; uninstall.sh
# leaves them installed. Trim this list for your own machine.
PACKAGES=(
  snapshot
)

EXTRA_BACKUP=(
  .config/omarchy/shell.json
)

# The old, misnamed Voxtype drop-in (it forced onnx-avx2, not Vulkan).
REMOVE_PATHS=(
  .config/systemd/user/voxtype.service.d/vulkan.conf
  # Parakeet on the CPU, replaced by Whisper on Vulkan (gpu.conf).
  .config/systemd/user/voxtype.service.d/onnx-avx2.conf
  # "Lid session" became Insomnia (shared omarchy-insomnia + timon.insomnia).
  .local/bin/omarchy-lid-session
  .config/omarchy/plugins/timon.lid-session
  # Now generic in omarchy-shared-config as omarchy-lid.
  .local/bin/omarchy-xps-lid
)
# Insomnia's laptop parts (omarchy-lid-quiet, omarchy-lowbat-saver,
# omarchy-power-saver, lid-freeze-apps and their user units) moved to
# omarchy-shared-config, which auto-detects laptop vs desktop.

post_install() {
  systemctl --user daemon-reload >/dev/null 2>&1 || true

  # The old XPS insomnia.conf is replaced by the shared auto-detection. Only
  # remove it if it is still that managed file (a hand-made override stays).
  local conf="$HOME/.config/omarchy/insomnia.conf"
  if [[ -f $conf ]] && grep -q 'Managed by omarchy-xps-config' "$conf"; then
    echo "Removing ~/.config/omarchy/insomnia.conf (now auto-detected by omarchy-shared-config)"
    rm -f "$conf"
  fi

  if [[ ! -f $HOME/.config/omarchy/shell.d/00-shared.json ]]; then
    echo "omarchy-shared-config is not installed yet. Install it, then run this again." >&2
  fi

  # 80 % charge limit: on by default, set once per machine so turning it off
  # by hand is not undone by the next install.
  local marker="$HOME/.local/state/omarchy-config/charge-limit-default"
  if [[ ! -f $marker ]] && "$HOME/.local/bin/battery-charge-limit" on >/dev/null 2>&1; then
    mkdir -p "$(dirname "$marker")" && touch "$marker"
    echo "Charge limit (80 %) turned on"
  fi

  if [[ -f /etc/systemd/logind.conf.d/30-xps-lid-on-ac.conf ]]; then
    echo
    echo "The old lid-on-AC drop-in is no longer used (Insomnia handles the lid). Remove it once:"
    echo "  sudo rm /etc/systemd/logind.conf.d/30-xps-lid-on-ac.conf && sudo systemctl reload systemd-logind"
  fi
}

pre_uninstall() { :; }
